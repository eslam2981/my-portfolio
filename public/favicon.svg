<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141824" />
      <stop offset="50%" stop-color="#0E1118" />
      <stop offset="100%" stop-color="#07080B" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CEFF00" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#CEFF00" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.7" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Dark Squircle -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)" />
  <rect width="492" height="492" x="10" y="10" rx="106" fill="none" stroke="url(#borderGrad)" stroke-width="12" />

  <!-- Code bracket accent < / > in the background -->
  <path d="M110 180 L60 256 L110 332" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M402 180 L452 256 L402 332" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Monogram: EG -->
  <g fill="#CEFF00" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="224" letter-spacing="-4" filter="url(#neonGlow)">
    <text x="256" y="332" text-anchor="middle">EG</text>
  </g>

  <!-- Live Pulse Status Dot in top right -->
  <circle cx="414" cy="98" r="18" fill="#CEFF00" />
  <circle cx="414" cy="98" r="28" fill="none" stroke="#CEFF00" stroke-width="5" opacity="0.35" />
</svg>